name: Build

# Every push to main builds the macOS and Windows apps and attaches them to the run.
# Pushing a tag like v0.2.0 also creates a draft GitHub Release with the installers.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download FFmpeg
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - run: npm ci

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test --lib -- --include-ignored

      - name: Build app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Audio Trimmer ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download the `.exe` (installer) or `.msi`. If SmartScreen warns, click *More info → Run anyway*.
            **macOS (Apple Silicon):** download the `.dmg`. The app isn't notarized; see the README for how to open it.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: audio-trimmer-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
