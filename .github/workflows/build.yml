name: Build

# Every push to main builds the macOS and Windows apps, installs each one on a fresh
# runner and drives it over MCP (scripts/mcp_smoke_test.py) to check it really works.
# Pushing a tag like v0.2.0 also publishes a GitHub Release, but only if those tests pass.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os-name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download FFmpeg
        shell: bash
        run: ./scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - run: npm ci

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test --lib -- --include-ignored

      - name: Build app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      # Give the installer a name that says which OS it's for, e.g. Kusanagi-0.2.0-Windows-Setup.exe.
      - name: Collect installer
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          case "${{ matrix.os-name }}" in
            macOS)   cp "$bundle_dir"/dmg/*.dmg "dist/Kusanagi-$version-macOS.dmg" ;;
            Windows) cp "$bundle_dir"/nsis/*-setup.exe "dist/Kusanagi-$version-Windows-Setup.exe" ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: Kusanagi-${{ matrix.os-name }}
          path: dist/*
          if-no-files-found: error

  # Install the real build, launch it, and drive it over MCP like an AI agent would.
  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: macOS
            runner: macos-latest
          - os-name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: Kusanagi-${{ matrix.os-name }}
          path: dist

      - name: Install and launch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *-Setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Directory -Filter 'Kusanagi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dir) { throw 'Install folder not found' }
          Get-ChildItem $dir.FullName | Format-Table Name, Length
          $app = Get-ChildItem $dir.FullName -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|ffmpeg' } | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          "FFMPEG=$(Join-Path $dir.FullName 'ffmpeg.exe')" >> $env:GITHUB_ENV

      - name: Install and launch (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/*.dmg -mountpoint /Volumes/Kusanagi -nobrowse
          cp -R "/Volumes/Kusanagi/Kusanagi.app" /Applications/
          hdiutil detach /Volumes/Kusanagi
          open "/Applications/Kusanagi.app"
          echo "FFMPEG=/Applications/Kusanagi.app/Contents/MacOS/ffmpeg" >> "$GITHUB_ENV"

      - name: Drive the app over MCP
        shell: bash
        run: python scripts/mcp_smoke_test.py --ffmpeg "$FFMPEG" --workdir "$RUNNER_TEMP/smoke"

      - name: Screenshot (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Left, $bounds.Top, 0, 0, $bitmap.Size)
          $bitmap.Save("$env:RUNNER_TEMP\screenshot.png")

      - name: Screenshot (macOS)
        if: always() && runner.os == 'macOS'
        run: screencapture -x "$RUNNER_TEMP/screenshot.png" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-${{ matrix.os-name }}
          path: |
            ${{ runner.temp }}/screenshot.png
            ${{ runner.temp }}/smoke/out/*
          if-no-files-found: ignore

  # Tagged builds that passed on both platforms become a public release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Kusanagi-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          ## Download

          | | |
          |---|---|
          | **Windows** (10 and 11) | `Kusanagi-VERSION-Windows-Setup.exe`: run it to install. If Windows shows "Windows protected your PC", click **More info → Run anyway**. |
          | **macOS** (Apple Silicon, M1 or newer) | `Kusanagi-VERSION-macOS.dmg`: open it and drag the app to Applications. The first time, right-click the app → **Open**. |

          FFmpeg is included; nothing else needs installing. Both builds were installed and tested automatically before this release was published.
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME#v}/g" notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Kusanagi $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
